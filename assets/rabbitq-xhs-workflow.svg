<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">rabbitQ 飞书 Markdown 转小红书图文工作流</title>
  <desc id="desc">支持飞书云文档链接、单文件、附件目录和 ZIP 四种输入，AI 两遍处理（符号转换加样式判断）并补充副标题，用户选择全封面、半封面或无封面，转换为可编辑的小红书三比四 Studio，最后保存 HTML 或按需导出 PNG。</desc>
  <rect width="1600" height="900" fill="#f2f5f7"/>
  <rect x="52" y="48" width="1496" height="804" rx="8" fill="#ffffff" stroke="#d9e1e7" stroke-width="2"/>

  <text x="82" y="112" fill="#17202a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="42" font-weight="800">飞书 Markdown → AI 处理 → 小红书 3:4 Studio</text>
  <text x="84" y="154" fill="#66727d" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="22">三种封面形式，默认交付可编辑 HTML</text>
  <rect x="1352" y="79" width="146" height="48" rx="8" fill="#17202a"/>
  <text x="1425" y="111" text-anchor="middle" fill="#ffffff" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700">rabbitQ</text>

  <g transform="translate(82 218)">
    <rect width="310" height="410" rx="8" fill="#ffffff" stroke="#cdd8df" stroke-width="2"/>
    <circle cx="46" cy="48" r="24" fill="#5fa66a"/>
    <text x="46" y="56" text-anchor="middle" fill="#ffffff" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="800">1</text>
    <rect x="92" y="25" width="56" height="70" rx="4" fill="#f3faf4" stroke="#5fa66a" stroke-width="3"/>
    <path d="M105 45h30M105 59h30M105 73h21" stroke="#5fa66a" stroke-width="3" stroke-linecap="round"/>
    <rect x="160" y="47" width="72" height="54" rx="4" fill="#f1f5fd" stroke="#4d7fd2" stroke-width="3"/>
    <path d="M169 88l18-18 12 12 10-9 14 15" fill="none" stroke="#4d7fd2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="145" fill="#17202a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="800">四种输入</text>
    <text x="28" y="184" fill="#66727d" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19">链接 / Markdown / 目录 / ZIP</text>
    <rect x="28" y="220" width="254" height="1" fill="#e1e7eb"/>
    <text x="28" y="250" fill="#2c3740" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19">• 飞书云文档链接直达</text>
    <text x="28" y="286" fill="#2c3740" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19">• 单个 .md 文件</text>
    <text x="28" y="322" fill="#2c3740" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19">• Markdown + 附件目录</text>
    <text x="28" y="358" fill="#2c3740" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19">• 完整飞书 ZIP 包</text>
    <text x="28" y="392" fill="#8a5b1f" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="17">链接由 AI 自动导出，视频跳过并提示</text>
  </g>

  <path d="M405 423h46" stroke="#5fa66a" stroke-width="5" stroke-linecap="round"/>
  <path d="M442 411l14 12-14 12" fill="none" stroke="#5fa66a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(466 218)">
    <rect width="310" height="410" rx="8" fill="#ffffff" stroke="#cdd8df" stroke-width="2"/>
    <circle cx="46" cy="48" r="24" fill="#4d7fd2"/>
    <text x="46" y="56" text-anchor="middle" fill="#ffffff" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="800">2</text>
    <path d="M123 27l6 18 18 6-18 6-6 18-6-18-18-6 18-6z" fill="#4d7fd2"/>
    <rect x="155" y="32" width="78" height="64" rx="4" fill="#f7f2fb" stroke="#a05bb8" stroke-width="3"/>
    <circle cx="175" cy="51" r="7" fill="#d99542"/>
    <path d="M163 86l20-20 13 12 11-10 18 18" fill="none" stroke="#a05bb8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="145" fill="#17202a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="800">AI 两遍处理</text>
    <text x="28" y="184" fill="#66727d" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19">先按符号照实转，再判断样式</text>
    <rect x="28" y="220" width="254" height="1" fill="#e1e7eb"/>
    <text x="28" y="250" fill="#2c3740" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19">• 第一遍：按符号照实转换</text>
    <text x="28" y="286" fill="#2c3740" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19">• 第二遍：AI 判断强调与结构</text>
    <text x="28" y="322" fill="#2c3740" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19">• 通读全文补副标题、选封面</text>
    <text x="28" y="358" fill="#2c3740" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19">• 生图可用时生成并直插 HTML</text>
    <text x="28" y="392" fill="#2e5fb2" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="17">==有色字== 与 ++下划线++ 行内语法</text>
  </g>

  <path d="M789 423h46" stroke="#4d7fd2" stroke-width="5" stroke-linecap="round"/>
  <path d="M826 411l14 12-14 12" fill="none" stroke="#4d7fd2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(850 218)">
    <rect width="310" height="410" rx="8" fill="#ffffff" stroke="#cdd8df" stroke-width="2"/>
    <circle cx="46" cy="48" r="24" fill="#d99542"/>
    <text x="46" y="56" text-anchor="middle" fill="#ffffff" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="800">3</text>
    <rect x="92" y="25" width="142" height="84" rx="5" fill="#fffaf0" stroke="#d99542" stroke-width="3"/>
    <rect x="103" y="36" width="37" height="62" rx="3" fill="#eef4fd" stroke="#4d7fd2" stroke-width="2"/>
    <rect x="145" y="36" width="37" height="62" rx="3" fill="#f6eff8" stroke="#a05bb8" stroke-width="2"/>
    <rect x="187" y="36" width="37" height="62" rx="3" fill="#f3faf4" stroke="#5fa66a" stroke-width="2"/>
    <text x="28" y="145" fill="#17202a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="800">生成 Studio</text>
    <text x="28" y="184" fill="#66727d" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19">结构解析、连续分页、三页总览</text>
    <rect x="28" y="220" width="254" height="1" fill="#e1e7eb"/>
    <text x="28" y="260" fill="#2c3740" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19">• 标题 · 正文 · 列表 · 表格</text>
    <text x="28" y="298" fill="#2c3740" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19">• 图片 · 引用 · 卡片 · 代码</text>
    <text x="28" y="336" fill="#2c3740" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19">• 主题 · 光标插图 · 跨页编辑</text>
    <text x="28" y="380" fill="#a75f12" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="17">浏览器直接打开，无需服务器</text>
  </g>

  <path d="M1173 423h46" stroke="#d99542" stroke-width="5" stroke-linecap="round"/>
  <path d="M1210 411l14 12-14 12" fill="none" stroke="#d99542" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(1234 218)">
    <rect width="284" height="410" rx="8" fill="#ffffff" stroke="#cdd8df" stroke-width="2"/>
    <circle cx="46" cy="48" r="24" fill="#17202a"/>
    <text x="46" y="56" text-anchor="middle" fill="#ffffff" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="800">4</text>
    <rect x="94" y="25" width="64" height="84" rx="4" fill="#f3faf4" stroke="#5fa66a" stroke-width="3"/>
    <rect x="168" y="37" width="64" height="84" rx="4" fill="#eef4fd" stroke="#4d7fd2" stroke-width="3"/>
    <path d="M126 46v40M114 74l12 12 12-12" fill="none" stroke="#5fa66a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="145" fill="#17202a" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="800">保存与导出</text>
    <text x="28" y="184" fill="#66727d" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19">先保留编辑结果，再决定出图</text>
    <rect x="28" y="220" width="228" height="1" fill="#e1e7eb"/>
    <text x="28" y="260" fill="#2c3740" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19">• 默认 xhs-studio.html</text>
    <text x="28" y="298" fill="#2c3740" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19">• 保存编辑后的 HTML</text>
    <text x="28" y="336" fill="#2c3740" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19">• 按需批量导出 PNG ZIP</text>
    <text x="28" y="380" fill="#2f7d3b" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="17">1080 × 1440 标准 3:4</text>
  </g>

  <rect x="82" y="690" width="1436" height="116" rx="8" fill="#17202a"/>
  <text x="112" y="728" fill="#ffffff" font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700">核心保证</text>
  <g font-family="'Noto Sans SC','Microsoft YaHei',sans-serif" font-size="19" fill="#eef3f6">
    <circle cx="132" cy="766" r="6" fill="#5fa66a"/><text x="150" y="773">本地处理，素材不上传</text>
    <circle cx="480" cy="766" r="6" fill="#4d7fd2"/><text x="498" y="773">原稿字段优先，不覆盖</text>
    <circle cx="842" cy="766" r="6" fill="#e6b657"/><text x="860" y="773">连续分页，结构块保持完整</text>
    <circle cx="1230" cy="766" r="6" fill="#d7789b"/><text x="1248" y="773">预览确认后再导出</text>
  </g>
</svg>

